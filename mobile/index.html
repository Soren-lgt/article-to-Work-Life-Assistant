<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="工作生活助手 移动版（PWA）：今日计划、记账、题库、开发工作、同组协作与备份恢复，数据存本机。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="生活助手">
  <link rel="stylesheet" href="css/mobile.css">
  <title>工作生活助手 · 移动版</title>
</head>
<body>
  <header class="appbar">
    <div class="appbar-title" id="pageTitle">首页总览</div>
    <div class="appbar-right">
      <button id="notifyBell" class="icon-btn" title="通知" aria-label="通知">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge" id="notifyBadge" hidden>0</span>
      </button>
      <button id="accountBtn" class="account-chip" title="账号管理">登录</button>
    </div>
  </header>

  <main class="views" id="views">
    <section class="module" data-module="home"></section>
    <section class="module" data-module="today" hidden></section>
    <section class="module" data-module="devwork" hidden></section>
    <section class="module" data-module="group" hidden></section>
    <section class="module" data-module="quiz" hidden></section>
    <section class="module" data-module="ledger" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab active" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>首页</span></button>
    <button class="tab" data-route="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M9 11l2 2 4-4"/><path d="M8 3v4M16 3v4"/></svg><span>计划</span></button>
    <button class="tab" data-route="devwork"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 6 8l-2 2v6l2 2 2 2"/><path d="m16 6 2 2 2 2v6l-2 2-2 2"/><path d="M14 4l-4 16"/></svg><span>开发</span></button>
    <button class="tab" data-route="group"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.5-4.5 5.5-4.5S14.5 17 14.5 20"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 15.6c2.8.2 5 1.6 5 4.4"/></svg><span>同组</span></button>
    <button class="tab" data-route="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.2 9a2.8 2.8 0 0 1 5.5.7c0 1.8-2.7 2.1-2.7 3.8"/><path d="M12 17h.01"/></svg><span>题库</span></button>
    <button class="tab" data-route="ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>记账</span></button>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
